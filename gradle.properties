# 6G：compressDebugAssets 要处理 ~126MB 的 runtime.zip。2G 偶发 OOM（run 39063013662），
# 4G 也偶发（run 40543616917，arm64-noruntime compressDebugAssets OOM；同输入的 tag 构建全绿）。
# GitHub hosted runner 16GB，6G + Kotlin daemon 仍有充足余量。
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
